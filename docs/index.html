<!doctype html><meta charset="utf-8"><title>mathpad</title><style>body{margin:0;display:flex;height:100vh;font:16px/1.6 sans-serif}#l{width:50%;padding:12px;border:0;border-right:1px solid #ccc;font:15px/1.7 Consolas,monospace;outline:none;resize:none}#r{flex:1;padding:16px;overflow:auto;line-height:1.9}</style>
<textarea id="l" placeholder="type LaTeX here: $x^2$ inline, $$...$$ own line. autosaved."></textarea><div id="r"></div>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script>var L=document.getElementById("l"),R=document.getElementById("r");function seg(line,c){var p=line.split(/(\$\$[^$]*\$\$|\$[^$]*\$)/);p.forEach(function(x){if(x.indexOf("$")===0){var dm=x.indexOf("$$")===0,e=document.createElement(dm?"div":"span");try{katex.render(x.replace(/^\$+|\$+$/g,""),e,{displayMode:dm,throwOnError:false})}catch(err){e.textContent=x}c.appendChild(e)}else if(x){c.appendChild(document.createTextNode(x))}})}function d(){localStorage.setItem("mp",L.value);R.innerHTML="";L.value.split("\n").forEach(function(line){var c=document.createElement("div");seg(line,c);R.appendChild(c)})}L.value=localStorage.getItem("mp")||"";L.oninput=d;d()</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
